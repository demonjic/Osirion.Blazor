name: Publish to NuGet

# Builds, tests and packs every package under src at the version its project file carries, pushes them to nuget.org
# and creates the GitHub release with its tag. It runs on every push to master and publishes only when that version has
# no tag yet, which is the case right after a release pull request (Prepare Release) merges. Pushing the tag
# v<version> or running it by hand on master also works.
#
# Publishing uses NuGet trusted publishing: nuget.org trades this workflow's GitHub OIDC token for an API key that
# lasts one hour. The policy on nuget.org names the repository owner, the repository and this file name
# (nuget-publish.yml), so renaming the file stops publishing until the policy is updated.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

# Two publishes of the same version must not race each other.
concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # A push to master publishes only a version that has no tag yet; every other push to master stops here.
  release-check:
    name: Is there a version to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for an untagged version
        id: check
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Osirion.Blazor/Osirion.Blazor.csproj)
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] \
            && git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::notice title=Nothing to publish::v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  pack:
    name: Build, test and pack
    needs: release-check
    if: needs.release-check.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      # Every package ships at one version, the one CHANGELOG.md describes; a tag must name the same version.
      - name: Check the version
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/Osirion.Blazor/Osirion.Blazor.csproj)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version"
            exit 1
          fi
          errors=0
          for project in src/*/*.csproj; do
            found=$(grep -oP '(?<=<Version>)[^<]+' "$project" || true)
            if [ "$found" != "$version" ]; then
              echo "::error file=$project::Version is '$found', expected '$version'"
              errors=$((errors + 1))
            fi
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $version"
            errors=$((errors + 1))
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## [$version]' section"
            errors=$((errors + 1))
          fi
          [ "$errors" -eq 0 ] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::Packing $version"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: |
          projects=(src/*/*.csproj)
          for project in "${projects[@]}"; do
            dotnet pack "$project" --no-build --configuration Release --output ./nupkgs
          done
          packed=$(find ./nupkgs -name '*.nupkg' | wc -l)
          if [ "$packed" -ne "${#projects[@]}" ]; then
            echo "::error::Packed $packed packages from ${#projects[@]} projects"
            exit 1
          fi
          ls -l ./nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: pack
    # Only a version tag or master publishes; a run started on any other branch stops after packing.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub release and, for a run started by hand, its tag
      id-token: write # trusted publishing
    env:
      VERSION: ${{ needs.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./nupkgs

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Requested right before the push because the key expires after an hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: obrana-boranija

      # A version already on nuget.org is skipped, so a failed run can be started again. Symbol packages
      # (.snupkg) next to the packages are pushed with them.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## \[/ { found = 0 } found' \
            CHANGELOG.md > release-notes.md
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$tag" ./nupkgs/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
