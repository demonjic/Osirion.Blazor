name: Build the site

# Builds getosirion.com (the Bootstrap example app) after CI passes on master and keeps the build as the artifact
# getosirion-site. The server pulls it: tools/deploy/Deploy-Getosirion.ps1 runs there on a schedule, downloads the
# newest artifact and swaps it in. Nothing connects to the server from here, so no port or credential of the server is
# exposed to this public repository.

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-site
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Publish the site
    # Only a push to master that passed CI; a pull request run or a failed run builds nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish examples/Osirion.Blazor.Example.Bootstrap --configuration Release --output site

      # The deploy script records which commit is live by this file.
      - name: Stamp the commit
        env:
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "$COMMIT" > site/deployed-commit.txt

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: getosirion-site
          path: site
          if-no-files-found: error
          retention-days: 14
