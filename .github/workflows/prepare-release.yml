name: Prepare Release

# Opens the pull request release/<version>: the version in every package under src, and the Unreleased notes in
# CHANGELOG.md moved under a new version heading. After the merge, push the tag v<version> to publish.
#
# The pull request is opened with PAT_TOKEN rather than the workflow token, because GitHub does not run workflows
# for pull requests that the workflow token opens, and the release pull request needs CI.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 4.1.0 or 4.1.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version"
            exit 1
          fi
          if grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md already has a section for $VERSION"
            exit 1
          fi

      - name: Set the version and date the changelog
        run: |
          for project in src/*/*.csproj; do
            sed -i "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" "$project"
          done
          # The templates create sites that reference the library version they are released with.
          sed -i "s|<PackageReference Include=\"Osirion.Blazor\" Version=\"[^\"]*\" />|<PackageReference Include=\"Osirion.Blazor\" Version=\"$VERSION\" />|" \
            src/Osirion.Blazor.Templates/templates/_shared/OsirionApp-CSharp.csproj
          sed -i "0,/^## \[Unreleased\]/s//## [Unreleased]\n\n## [$VERSION] - $(date -u +%Y-%m-%d)/" CHANGELOG.md
          git diff --stat

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "chore(release): ${{ inputs.version }}"
          branch: "release/${{ inputs.version }}"
          delete-branch: true
          title: "chore(release): ${{ inputs.version }}"
          body: |
            Sets every package under `src` to ${{ inputs.version }} and moves the Unreleased notes in CHANGELOG.md under
            `## [${{ inputs.version }}]`.

            Before merging, read the notes: they become the GitHub release text.

            After merging, push the tag `v${{ inputs.version }}` on the merge commit. That starts "Publish to NuGet",
            which checks the version again, runs the tests, publishes the packages and creates the release.
